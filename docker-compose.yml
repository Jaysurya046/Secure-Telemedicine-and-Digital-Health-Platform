version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: telemedicine_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemedicine_db}
      POSTGRES_USER: ${POSTGRES_USER:-telemedicine_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemedicine_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telemedicine_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: telemedicine_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telemedicine_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemedicine_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telemedicine_user}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-telemedicine_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telemedicine_network

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemedicine_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telemedicine_user}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-telemedicine_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - telemedicine_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemedicine_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telemedicine_user}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-telemedicine_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - telemedicine_network

  # Node.js Real-time Service
  realtime:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
    container_name: telemedicine_realtime
    command: npm start
    volumes:
      - ./realtime-service:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - DJANGO_API_URL=http://backend:8000
    depends_on:
      - redis
      - backend
    networks:
      - telemedicine_network

  # Next.js Patient Portal
  patient_portal:
    build:
      context: ./patient-portal
      dockerfile: Dockerfile
    container_name: telemedicine_patient_portal
    command: npm run dev
    volumes:
      - ./patient-portal:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:3002
    depends_on:
      - backend
      - realtime
    networks:
      - telemedicine_network

  # React Doctor Dashboard
  doctor_dashboard:
    build:
      context: ./doctor-dashboard
      dockerfile: Dockerfile
    container_name: telemedicine_doctor_dashboard
    command: npm run dev
    volumes:
      - ./doctor-dashboard:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:3002
    depends_on:
      - backend
      - realtime
    networks:
      - telemedicine_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  telemedicine_network:
    driver: bridge
